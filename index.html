<style id="chest-style">
/* Layout: one column. Header left-aligned, the chest centred as the hero, the flashcard deck opens under it, then the ship's log and the stash form. */
:root{
  --bg:#fbf0f3; --bg-glow:#f8d9e3; --surface:#fffafc; --chip:#fde7ee;
  --ink:#2b1320; --muted:#7c5767; --line:#efd2dc;
  --berry:#d4235c; --berry-ink:#ad1747; --on-berry:#ffffff; --ring:rgba(212,35,92,.22);
  --brass:#c9982e; --brass-dark:#7d5a12; --brass-text:#86600f;
  --wood-1:#6a3822; --wood-2:#46200f; --wood-3:#8b5232; --seam:rgba(28,8,4,.35);
  --shadow:rgba(60,14,34,.45); --glow:rgba(255,205,110,.75);
  --font-display:"Pirata One","UnifrakturCook",Georgia,serif;
  --font-word:"Young Serif",Georgia,"Times New Roman",serif;
  --font-body:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-pixel:"Silkscreen","Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#170a11; --bg-glow:#3a1426; --surface:#22111a; --chip:#2e1622;
    --ink:#f7e6ed; --muted:#c39fb0; --line:#3d2231;
    --berry:#ff4d86; --berry-ink:#ff7ea6; --on-berry:#2a0614; --ring:rgba(255,77,134,.3);
    --brass:#e0b04a; --brass-dark:#8f6716; --brass-text:#e9c36a;
    --wood-1:#7a4228; --wood-2:#4f2512; --wood-3:#9b5d39; --seam:rgba(0,0,0,.45);
    --shadow:rgba(0,0,0,.7); --glow:rgba(255,196,96,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#170a11; --bg-glow:#3a1426; --surface:#22111a; --chip:#2e1622;
  --ink:#f7e6ed; --muted:#c39fb0; --line:#3d2231;
  --berry:#ff4d86; --berry-ink:#ff7ea6; --on-berry:#2a0614; --ring:rgba(255,77,134,.3);
  --brass:#e0b04a; --brass-dark:#8f6716; --brass-text:#e9c36a;
  --wood-1:#7a4228; --wood-2:#4f2512; --wood-3:#9b5d39; --seam:rgba(0,0,0,.45);
  --shadow:rgba(0,0,0,.7); --glow:rgba(255,196,96,.6);
  color-scheme:dark;
}
body{
  background:radial-gradient(1100px 460px at 50% -8%, var(--bg-glow), transparent 62%), var(--bg);
  background-color:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
}
.wrap{
  max-width:720px; margin:0 auto; box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:28px 44px;
}
.eyebrow{font:800 .72rem/1 var(--font-body); letter-spacing:.18em; text-transform:uppercase; color:var(--berry-ink); margin:0}
h1{font:400 clamp(2.7rem, 11vw, 4.4rem)/.95 var(--font-display); margin:.18em 0 .14em; color:var(--ink); text-wrap:balance}
.lede{max-width:46ch; font-size:1rem; line-height:1.55; color:var(--muted); margin:0}
.lede b{color:var(--berry-ink); font-weight:800}
.tally{display:inline-flex; align-items:center; gap:9px; margin-top:14px; padding:8px 12px; border-radius:4px; background:var(--chip); border:1px solid var(--line); font:400 .74rem/1 var(--font-pixel); letter-spacing:.03em; text-transform:uppercase; color:var(--ink)}
.coin{position:relative; flex:none; width:10px; height:10px}
.coin::before{content:""; position:absolute; left:0; top:0; width:2px; height:2px;
  box-shadow:2px 0 0 #ffd74a, 4px 0 0 #ffd74a, 6px 0 0 #ffd74a,
    0 2px 0 #ffd74a, 2px 2px 0 #fff7cf, 4px 2px 0 #ffd74a, 6px 2px 0 #d39e1f, 8px 2px 0 #8a5a10,
    0 4px 0 #ffd74a, 2px 4px 0 #ffd74a, 4px 4px 0 #d39e1f, 6px 4px 0 #d39e1f, 8px 4px 0 #8a5a10,
    0 6px 0 #ffd74a, 2px 6px 0 #d39e1f, 4px 6px 0 #d39e1f, 6px 6px 0 #8a5a10, 8px 6px 0 #8a5a10,
    2px 8px 0 #8a5a10, 4px 8px 0 #8a5a10, 6px 8px 0 #8a5a10}

/* the chest: a 48x46 pixel sprite drawn on canvas, scaled up with hard pixel edges */
.chest-stage{position:relative; display:grid; justify-items:center; gap:12px; padding-block:22px 4px}
.chest{appearance:none; -webkit-appearance:none; border:0; background:none; padding:0; margin:0; cursor:pointer; display:block; width:min(288px, 74vw); max-width:100%; aspect-ratio:48/46; border-radius:6px; -webkit-tap-highlight-color:transparent}
.chest:focus-visible{outline:3px solid var(--berry); outline-offset:6px}
.chest canvas{display:block; width:100%; height:100%; image-rendering:crisp-edges; image-rendering:pixelated}
.chest-hint{margin:0; font:400 .72rem/1.3 var(--font-pixel); letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}

/* the deck */
.deck{display:grid; justify-items:center; gap:14px; padding-block:18px 4px}
.card{appearance:none; -webkit-appearance:none; border:0; padding:0; margin:0; background:none; cursor:pointer; font:inherit; color:inherit; display:block;
  width:min(360px, 100%); height:clamp(232px, 64vw, 262px); perspective:1100px; -webkit-tap-highlight-color:transparent}
.card:focus-visible{outline:3px solid var(--berry); outline-offset:6px; border-radius:18px}
.card-inner{position:relative; display:block; width:100%; height:100%; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.3,.9,.3,1)}
.card.is-flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute; inset:0; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
  padding:22px 22px 30px; border-radius:18px; overflow-y:auto; text-align:center;
  -webkit-backface-visibility:hidden; backface-visibility:hidden;
  background:var(--surface); border:1px solid var(--line); box-shadow:0 14px 30px -16px var(--shadow)}
.face.front{border-top:7px solid var(--berry)}
.face.back{border-top:7px solid var(--brass); transform:rotateY(180deg)}
.face-label{display:block; font:800 .66rem/1 var(--font-body); letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.word{display:block; font:400 clamp(1.55rem, 6.4vw, 2.15rem)/1.15 var(--font-word); color:var(--ink); text-wrap:balance; overflow-wrap:anywhere}
.say{display:block; font:italic 500 .98rem/1.3 var(--font-body); color:var(--berry-ink)}
.flip-hint{position:absolute; left:0; right:0; bottom:11px; font:600 .72rem/1 var(--font-body); color:var(--muted)}
.meaning{display:block; font:800 1.18rem/1.3 var(--font-body); color:var(--ink); text-wrap:balance}
.tip, .earned{display:block; max-width:32ch; font-size:.86rem; line-height:1.42; color:var(--muted)}
.earned b{color:var(--ink); font-weight:800}
.forms{display:grid; gap:4px; max-width:32ch; margin:2px 0 0; padding:8px 0 0; list-style:none; border-top:1px dashed var(--line); text-align:center}
.forms-label{display:block; font:800 .62rem/1 var(--font-body); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:2px}
.forms li{font-size:.84rem; line-height:1.38; color:var(--muted)}
.forms .f-de{font-family:var(--font-word); color:var(--ink); font-size:.98rem}
.log-detail .forms{max-width:none; text-align:left}
.date{display:block; font:700 .7rem/1 var(--font-body); letter-spacing:.12em; text-transform:uppercase; color:var(--brass-text); font-variant-numeric:tabular-nums}
.controls{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center}
.btn{appearance:none; -webkit-appearance:none; font:700 .9rem/1 var(--font-body); padding:11px 16px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer}
.btn:hover{border-color:var(--berry)}
.btn:focus-visible{outline:3px solid var(--berry); outline-offset:2px}
.btn.primary{background:var(--berry); border-color:var(--berry); color:var(--on-berry)}
.btn[disabled]{opacity:.55; cursor:default}
.count{min-width:5.4em; text-align:center; font:400 .72rem/1 var(--font-pixel); text-transform:uppercase; color:var(--muted)}
.keys{margin:0; font-size:.76rem; color:var(--muted)}

/* log + form */
.section{margin-top:36px; padding-top:20px; border-top:2px dashed var(--line)}
.sec-title{font:400 2.05rem/1 var(--font-display); margin:0; color:var(--ink)}
.sec-sub{margin:.4em 0 1em; color:var(--muted); font-size:.92rem; line-height:1.45}
.log{list-style:none; margin:0; padding:0; display:grid}
.log-row{display:grid; grid-template-columns:4.4em minmax(0,1fr) auto auto; gap:6px 14px; align-items:baseline; padding:13px 2px; border-bottom:1px solid var(--line)}
.log-no{font:400 .7rem/1 var(--font-pixel); text-transform:uppercase; color:var(--brass-text)}
.log-main{min-width:0; display:flex; flex-wrap:wrap; gap:3px 12px; align-items:baseline}
.log-de{font:400 1.14rem/1.25 var(--font-word); color:var(--ink); overflow-wrap:anywhere}
.log-en{color:var(--muted); font-size:.92rem; line-height:1.35}
.log-date{font:700 .74rem/1 var(--font-body); color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
.log-open{appearance:none; -webkit-appearance:none; border:0; background:none; padding:0; margin:0; font:inherit; color:inherit; text-align:left; cursor:pointer;
  grid-column:1 / 4; display:grid; grid-template-columns:4.4em minmax(0,1fr) auto; gap:6px 14px; align-items:baseline; border-radius:8px; -webkit-tap-highlight-color:transparent}
.log-open:hover .log-de{color:var(--berry-ink)}
.log-open:focus-visible{outline:2px solid var(--berry); outline-offset:4px}
.log-caret{display:inline-block; margin-left:6px; font-size:.7em; color:var(--muted); transition:transform .2s}
.log-row.is-open .log-caret{transform:rotate(90deg)}
.log-detail{grid-column:1 / -1; display:grid; gap:7px; margin:6px 0 2px; padding:14px 16px; border-radius:14px; background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--brass)}
.log-detail .tip, .log-detail .earned{max-width:none}
.log-detail .btn{justify-self:start; margin-top:4px; padding:8px 13px; font-size:.82rem}
.x{appearance:none; -webkit-appearance:none; border:0; background:none; color:var(--muted); font:700 1.15rem/1 var(--font-body); cursor:pointer; padding:4px 7px; border-radius:8px}
.x:hover{color:var(--berry)}
.x:focus-visible{outline:2px solid var(--berry)}
.confirm{grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:.9rem; color:var(--ink); padding-top:4px}
.empty{color:var(--muted); font-size:.95rem; margin:0}
.form{display:grid; gap:12px; grid-template-columns:1fr 1fr}
.field{display:grid; gap:5px; min-width:0}
.field.full{grid-column:1 / -1}
.field label{font:800 .78rem/1.2 var(--font-body); color:var(--ink)}
.field .opt{font-weight:500; color:var(--muted)}
.field input{box-sizing:border-box; width:100%; font:500 1rem/1.3 var(--font-body); padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink)}
.field input:focus{outline:none; border-color:var(--berry); box-shadow:0 0 0 3px var(--ring)}
.form-actions{grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.status{font-size:.88rem; color:var(--muted); margin:0}
.readonly{color:var(--muted); font-size:.88rem; margin:0}
.foot{margin-top:38px; font-size:.8rem; line-height:1.5; color:var(--muted)}
@media (max-width:520px){
  .form{grid-template-columns:1fr}
  .log-row{grid-template-columns:3.4em minmax(0,1fr) auto}
  .log-open{grid-column:1 / 3; grid-template-columns:3.4em minmax(0,1fr)}
  .log-date{grid-column:2}
  .log-row .x{grid-column:3; grid-row:1}
}
@media (prefers-reduced-motion: reduce){
  .card-inner{transition:none}
}
</style>
<main id="app" class="wrap"></main>

    ui.busy = false;
    if (code === 'conflict') { setStatus('The chest changed somewhere else. Loading the newest one…'); return; }
    if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].indexOf(code) !== -1) {
      ui.writable = false; ui.confirmId = null;
      try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) { /* fine */ }
      renderForm(); renderLog();
      return;
    }
    renderForm(); renderLog();
    if (code === 'rate_limited') setStatus('Too many saves in a row. Give it a minute, then try again.');
    else if (code === 'too_large') setStatus('The chest is full. Throw an old treasure overboard first.');
    else setStatus('That did not save. Try again in a moment.');
  }

  /* ---------- boot ---------- */
  mount();
  if (ctx) chestLoop();

  (async function () {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') { ui.writable = false; renderForm(); renderLog(); return; }
    try { artifactNs = await c.use('artifact'); } catch (e) { artifactNs = null; }
    if (!artifactNs) { ui.writable = false; renderForm(); renderLog(); return; }
    var can = null;
    try { var u = await c.use('user'); if (u) can = await u.canEdit(); } catch (e) { can = null; }
    ui.writable = can === false ? false : true;
    renderForm(); renderLog();
  })();
})();
</script>
</body>
</html>
